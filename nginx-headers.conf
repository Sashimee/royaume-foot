# The headers EVERY response has to carry.
#
# This file exists because of an nginx trap: an `add_header` inside a `location`
# block does not add to the server's headers, it REPLACES all of them. A block
# that only sets a cache rule therefore drops the security policy silently. They
# live here, and every block re-includes them.
add_header Content-Security-Policy "frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
