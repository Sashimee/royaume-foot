# Serving the game.
#
# One page, a service worker, and a pile of fingerprinted assets. Nothing is
# dynamic and there is no API, so this file has exactly three jobs: the headers,
# the cache, and not breaking the service worker.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Redirects go out relative. Otherwise nginx rebuilds an absolute URL from
    # what it believes its host to be — behind Traefik that is its internal port
    # over plain http.
    absolute_redirect off;

    include /etc/nginx/snippets/headers.conf;

    # ---------------------------------------------------------------------
    # Compression
    # ---------------------------------------------------------------------
    # The .gz files were produced at build time, once, at level 9.
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    # ---------------------------------------------------------------------
    # Cache
    # ---------------------------------------------------------------------
    # Assets carry a hash in the filename: a change produces a different name,
    # so these can be kept forever.
    #
    # Cache-Control is set by hand rather than with `expires`, because both write
    # the same header and the response then carries two of them, one without
    # `immutable`.
    location /assets/ {
        include /etc/nginx/snippets/headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # The service worker decides when every other file is allowed to update, so
    # it is the one file that must never be held. A cached sw.js pins a child on
    # the version they first installed, and no amount of redeploying reaches
    # them. `registerSW.js` is what fetches it, and has the same problem.
    location ~* ^/(sw\.js|registerSW\.js|workbox-[^/]+\.js)$ {
        include /etc/nginx/snippets/headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # The manifest names the icons and the start URL. Short, not immutable.
    location = /manifest.webmanifest {
        include /etc/nginx/snippets/headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        types { } default_type application/manifest+json;
    }

    # Icons and the favicon are served from public/ and carry no hash, so they
    # cannot be immutable — but they change about once a year. A week means the
    # second visit is free and a corrected icon still gets through.
    location ~* \.(png|svg)$ {
        include /etc/nginx/snippets/headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        access_log off;
    }

    # The page itself carries no hash. Held, it would show the old version after
    # a deploy, naming assets that no longer exist.
    location = /index.html {
        include /etc/nginx/snippets/headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # The game has no client-side router — every screen is state, not a URL — so
    # an address that does not exist is a 404 and not a silent redirect to the
    # menu. try_files serves index.html without passing through the block above,
    # hence the cache rule repeated here.
    location / {
        include /etc/nginx/snippets/headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
}
