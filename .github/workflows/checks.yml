# Checks only.
#
# This workflow used to build the game and publish it to GitHub Pages. It is now
# served from https://foot.bas.lu by Dokploy, which builds the image itself from
# this repository — so what is left here is the gate, not the delivery.
#
# The e2e run lives here and nowhere else: it needs a browser, which the
# production image deliberately does not carry.
name: Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npx playwright install chromium --with-deps
      - run: npm run test:e2e
      - run: npm run build
